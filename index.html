const [type, name, details, catOrSpec, phoneOrPrice, statusOrStock, extra] = rows[i].map(c => (c || "").replace(/^"|"$/g, "").trim());
if (!type || !name) continue;
if (type === "خدمة") ns.push({ name, desc: details, specialist: catOrSpec, phone: phoneOrPrice, status: statusOrStock || "متاح", reqs: extra ? extra.split("-").map(x => x.trim()) : [] });
else if (type === "منتج") np.push({ name, desc: details, category: catOrSpec || "قرطاسيات", price: phoneOrPrice, stock: parseInt(statusOrStock) || 0, img: extra || "unsplash.com" });
else if (type === "باقة") npk.push({ name, items: details, price: phoneOrPrice || "عرض خاص", phone: extra || appData.settings.generalWa });
else if (type === "طلب") no.push({ id: name, desc: details, phone: phoneOrPrice, status: statusOrStock || "تم استلام الطلب" });
else if (type === "اعدادات") {
if (name === "واتساب_عام") appData.settings.generalWa = details;
if (name === "واتساب_المبيعات") appData.settings.salesWa = details;
if (name === "شريط_اعلاني") appData.settings.announcement = details;
if (name === "اوقات_العمل") appData.settings.hours = details;
if (name === "العنوان") appData.settings.address = details;
if (name === "رابط_الخريطة") appData.settings.mapUrl = details;
}
}
if (ns.length) appData.services = ns;
if (np.length) appData.products = np;
if (npk.length) appData.packages = npk;
if (no.length) appData.orders = no;
}
} catch (e) {}
renderAll();
}
function renderAll() {
const annBar = document.getElementById("announcement-bar");
if (appData.settings.announcement) { document.getElementById("announcement-text").textContent = appData.settings.announcement; annBar.classList.remove("hidden"); }
else annBar.classList.add("hidden");
document.getElementById("hero-wa-btn").href = formatWaLink(appData.settings.generalWa, "السلام عليكم، أرغب بالاستفسار عن خدمات ركن الوسطى");
document.getElementById("footer-address").textContent = appData.settings.address;
document.getElementById("footer-hours").textContent = appData.settings.hours;
const waL = document.getElementById("footer-wa-link"); waL.textContent = appData.settings.generalWa; waL.href = formatWaLink(appData.settings.generalWa);
document.getElementById("footer-map-btn").href = appData.settings.mapUrl;
document.getElementById("services-grid").innerHTML = appData.services.map((s, i) => {
const ok = s.status.includes("متاح") && !s.status.includes("غير");
return `



${s.name}
${ok ? '● متاح الآن' : '● غير متاح'}
${s.desc}
${s.reqs.length ? `📄 المستندات المطلوبة ▾
{s.reqs.map(r => `<li>{r}`).join("")}
` : ""}
👤 ${s.specialist}${s.phone}
💬 تواصل مع المختص واتساب

`;
}).join("");
document.getElementById("floating-wa-list").innerHTML = appData.services.map(s => <a href="${formatWaLink(s.phone,السلام عليكم، بخصوص: ${s.name})}" target="_blank" class="float-item"> <div style="font-weight:700;">${s.name}</div> <div style="color:#6B7280;display:flex;justify-content:space-between;margin-top:2px;"><span>${s.specialist}</span><span dir="ltr">${s.phone}</span></div> </a>).join("");
const cats = ["الكل", ...new Set(appData.products.map(p => p.category))];
document.getElementById("category-filters").innerHTML = cats.map(c =>  <button onclick="selectedCategory='${c}';renderAll()" class="filter-btn ${selectedCategory === c ? 'active' : ''}">${c}</button>).join("");
const filtered = selectedCategory === "الكل" ? appData.products : appData.products.filter(p => p.category === selectedCategory);
document.getElementById("products-grid").innerHTML = filtered.map(p => {
const ok = p.stock > 0;
return <div class="prod-card"> <div> <div class="prod-img"><img src="${p.img}" alt="${p.name}" /><span class="prod-cat">${p.category}</span></div> <div class="prod-body"> <span class="status-pill ${ok ? 'status-on' : 'status-off'}">${ok ?متوفر (${p.stock} قطعة)` : 'نفدت الكمية'}
${p.name}
${p.desc}
${p.price ? p.price + ' ر.س' : 'تواصل للسعر'}



<button onclick="addToCart('${p.name.replace(/'/g, "\'")}','${p.price}')" ${!ok ? 'disabled' : ''} class="btn" style="flex:1;background:${ok ? '#1A1A1A' : '#D1D5DB'};color:#fff;font-size:12px;">+ أضف للسلة
💬

`;
}).join("");
document.getElementById("packages-grid").innerHTML = appData.packages.map(pkg => `


${pkg.price}
${pkg.name}
${pkg.items}
💬 اطلب الباقة الآن
`).join("");
}
function addToCart(name, price) {
const f = cart.find(i => i.name === name);
if (f) f.qty++; else cart.push({ name, price, qty: 1 });
updateCartUI();
}
function updateCartUI() {
const total = cart.reduce((s, i) => s + i.qty, 0);
const b = document.getElementById("cart-badge"); b.textContent = total; b.classList.toggle("hidden", total === 0);
document.getElementById("cart-items").innerHTML = cart.length ? cart.map((it, i) =>  <div style="display:flex;justify-content:space-between;align-items:center;background:var(--light);padding:10px;border-radius:8px;"> <div><div style="font-weight:700;font-size:14px;">${it.name}</div><div style="font-size:12px;color:#6B7280;">الكمية: ${it.qty}</div></div> <div style="display:flex;gap:6px;"> <button onclick="cart[${i}].qty--;if(cart[${i}].qty<=0)cart.splice(${i},1);updateCartUI()" style="padding:4px 10px;border-radius:6px;background:#fff;border:1px solid #ccc;">-</button> <button onclick="cart[${i}].qty++;updateCartUI()" style="padding:4px 10px;border-radius:6px;background:#fff;border:1px solid #ccc;">+</button> </div> </div>).join("") : <p style="text-align:center;color:#9CA3AF;padding:20px;">السلة فارغة حالياً</p>;
}
function toggleCart() { updateCartUI(); document.getElementById("cart-modal").classList.toggle("hidden"); }
function sendCartToWhatsApp() {
if (!cart.length) return;
let m = "السلام عليكم، أرغب بطلب الأصناف التالية من ركن الوسطى:\n\n";
cart.forEach((it, i) => m += ${i + 1}. ${it.name} — الكمية: (${it.qty})\n);
window.open(formatWaLink(appData.settings.salesWa, m), "_blank");
}
function trackOrder() {
const q = document.getElementById("track-input").value.trim();
const box = document.getElementById("track-result");
if (!q) return;
const f = appData.orders.find(o => o.id === q || o.phone.includes(q));
box.classList.remove("hidden");
if (!f) { box.style.background = "#FEF2F2"; box.style.color = "#9E1B1E"; box.innerHTML = "لم يتم العثور على طلب بهذا الرقم."; return; }
box.style.background = "#ECFDF5"; box.style.color = "#15803D";
box.innerHTML = <strong>رقم الطلب #${f.id}</strong><br>الحالة الحالية: <strong>${f.status}</strong><br><small>${f.desc}</small>;
}
function openQrModal() {
document.getElementById("qr-image").src = https://qrserver.com{encodeURIComponent(window.location.href)};
document.getElementById("qr-modal").classList.remove("hidden");
}
function shareSiteWhatsApp() {
window.open(https://wa.me{encodeURIComponent("تفضل بزيارة موقع ركن الوسطى للخدمات والقرطاسيات:\n" + window.location.href)}, "_blank");
}
